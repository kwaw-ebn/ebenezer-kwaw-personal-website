<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">PharmaStock POS project overview</title><desc id="desc">An illustrative overview of pharmacy inventory, point of sale and verified payment workflows. Not a screenshot or measured result.</desc><rect width="1200" height="675" fill="#eef8f5"/><rect x="48" y="48" width="1104" height="579" rx="28" fill="#fff" stroke="#cce4db"/><g font-family="Arial, sans-serif"><rect x="80" y="83" width="48" height="48" rx="13" fill="#087d75"/><path d="M104 94v26M91 107h26" stroke="#fff" stroke-width="5"/><text x="145" y="119" font-size="29" font-weight="700" fill="#123f38">PharmaStock POS</text><text x="82" y="183" font-size="18" fill="#546f68">PHARMACY OPERATIONS · PROJECT OVERVIEW</text><text x="82" y="238" font-size="39" font-weight="700" fill="#123f38">Better stock. Accountable sales.</text><rect x="82" y="283" width="318" height="212" rx="18" fill="#eaf6f0"/><rect x="440" y="283" width="318" height="212" rx="18" fill="#eaf4fb"/><rect x="798" y="283" width="318" height="212" rx="18" fill="#fff4de"/><g font-size="24" font-weight="700" fill="#123f38"><text x="108" y="328">Inventory</text><text x="466" y="328">Point of sale</text><text x="824" y="328">Payments</text></g><g font-size="19" fill="#39594e"><text x="108" y="374">Batch and expiry tracking</text><text x="108" y="412">FEFO stock allocation</text><text x="108" y="450">Receipts and movements</text><text x="466" y="374">Role-based staff access</text><text x="466" y="412">Stock reservations</text><text x="466" y="450">Sales and audit records</text><text x="824" y="374">Hosted Paystack checkout</text><text x="824" y="412">Server-side verification</text><text x="824" y="450">Merchant setup required</text></g><text x="82" y="553" font-size="20" fill="#087d75">React + FastAPI · Render frontend and API · Neon PostgreSQL</text><text x="82" y="592" font-size="16" fill="#657c75">Illustrative project overview · Pilot MVP · No pharmacy outcomes claimed</text></g></svg>