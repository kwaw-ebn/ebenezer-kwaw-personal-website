<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">FixMyArea community issue reporting</title><desc id="desc">A conceptual preview showing photo and location reporting, tracking and evidence of resolution. No real reports or statistics are shown.</desc><rect width="1200" height="675" fill="#f3f8ef"/><rect x="60" y="60" width="1080" height="555" rx="30" fill="#123f37"/><text x="110" y="140" fill="#bde77a" font-family="Arial,sans-serif" font-size="24" letter-spacing="3">CIVIC TECHNOLOGY · PILOT MVP</text><text x="110" y="225" fill="white" font-family="Arial,sans-serif" font-size="66" font-weight="700">FixMyArea</text><text x="110" y="275" fill="#d7e7dd" font-family="Arial,sans-serif" font-size="28">Report it. Track it. Improve your community.</text><g font-family="Arial,sans-serif"><rect x="110" y="330" width="280" height="190" rx="18" fill="#ffffff"/><text x="135" y="375" fill="#557c61" font-size="20">01 · REPORT</text><text x="135" y="425" fill="#123f37" font-size="28" font-weight="700">Photo + location</text><text x="135" y="470" fill="#557c61" font-size="19">Make the issue visible</text><rect x="420" y="330" width="280" height="190" rx="18" fill="#ffffff"/><text x="445" y="375" fill="#557c61" font-size="20">02 · TRACK</text><text x="445" y="425" fill="#123f37" font-size="28" font-weight="700">Public progress</text><text x="445" y="470" fill="#557c61" font-size="19">Follow the report timeline</text><rect x="730" y="330" width="280" height="190" rx="18" fill="#bde77a"/><text x="755" y="375" fill="#123f37" font-size="20">03 · SEE ACTION</text><text x="755" y="425" fill="#123f37" font-size="28" font-weight="700">Resolution evidence</text><text x="755" y="470" fill="#123f37" font-size="19">Show the completed work</text></g><text x="110" y="568" fill="#d7e7dd" font-family="Arial,sans-serif" font-size="18">Built by Ebenezer Kwaw · Conceptual project illustration</text></svg>